[package]
name = "octoling"
version = "0.2.0"
license = "MIT"
edition = "2024"

[dependencies]
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "cuda-13030", "dynamic-loading"] }
memmap2 = "0.9"
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
serde_json = "1"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1
panic = "abort"

[lints.clippy]
# 数値の計算のコードで、書き方の好みに当たるもの
excessive_precision = "allow" # 定数は出典の桁のまま書く
needless_range_loop = "allow" # 同じ添字で複数の配列を読む
too_many_arguments = "allow"
type_complexity = "allow"
