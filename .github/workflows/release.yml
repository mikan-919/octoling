name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 実行ファイルは配らない。target-cpu=native で組み立てるので、配っても動く CPU が限られる
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 注釈付きタグの本文をリリースノートの先頭に置き、その後に GitHub が作る変更の一覧を続ける
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            --notes "$(git tag -l --format='%(contents)' "$TAG")"
