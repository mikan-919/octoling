name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      # GPU は無いが、単体テストは CPU だけで動き、カーネルの NVRTC での翻訳も確かめる。
      # runner の CPU は AVX-512 があるとは限らないので、無い時は組み立てだけにする
      - name: Test
        run: |
          grep -m1 'model name' /proc/cpuinfo
          if grep -qw avx512f /proc/cpuinfo; then
            nix develop -c cargo test --release
          else
            echo "::warning::runner の CPU に AVX-512 が無いので、テストは実行せず組み立てだけ確かめる"
            # --target を付けると RUSTFLAGS がビルドスクリプトにかからない (かかると runner で SIGILL になる)
            RUSTFLAGS="-C target-cpu=x86-64-v4" nix develop -c cargo test --release --no-run --target x86_64-unknown-linux-gnu
          fi
