name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      # runner の CPU は AVX-512 があるとは限らない。無い時は AVX-512 向けに組み立てるだけにする。
      # target を指定すると RUSTFLAGS がビルドスクリプトにかからない (かかると runner で SIGILL になる)
      - name: Check CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          if grep -qw avx512f /proc/cpuinfo; then
            echo "AVX512=1" >> "$GITHUB_ENV"
          else
            echo "::warning::runner の CPU に AVX-512 が無いので、テストは実行せず組み立てだけ確かめる"
            echo "RUSTFLAGS=-C target-cpu=x86-64-v4" >> "$GITHUB_ENV"
            echo "CARGO_BUILD_TARGET=x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
          fi
      - name: Format
        run: nix develop -c cargo fmt --check
      - name: Clippy
        run: nix develop -c cargo clippy --release --all-targets -- -D warnings
      # GPU は無いが、単体テストは CPU だけで動き、カーネルの NVRTC での翻訳も確かめる
      - name: Test
        run: |
          if [ -n "$AVX512" ]; then
            nix develop -c cargo test --release
          else
            nix develop -c cargo test --release --no-run
          fi
